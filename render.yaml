# Render Blueprint for the AISSM backend.
# In Render: New → Blueprint → connect this repo. Render reads this file,
# creates the service, and asks you to paste the secret values below.
#
# You'll need two free services first (their connection strings go in the
# env vars marked "sync: false"):
#   • Postgres  → Neon   (neon.tech)      → DATABASE_URL
#   • Redis     → Upstash (upstash.com)   → REDIS_URL
services:
  - type: web
    name: aissm-backend
    runtime: node
    # Starter, not free: a free service sleeps after ~15 minutes idle and takes
    # ~51 seconds to wake (measured). Twilio abandons a webhook at 15 seconds,
    # so the first text anyone sends after a quiet spell is the one most likely
    # to be dropped. ~$7/month buys a service that is always awake.
    plan: starter
    branch: main
    # Build the shared contracts, generate the Prisma client, then compile.
    # --include=dev is required: NODE_ENV=production otherwise makes npm skip
    # the build tools (nest CLI, typescript, prisma), which breaks the build.
    buildCommand: >-
      npm install --include=dev &&
      npm run build:contracts &&
      npm --workspace @smm/backend run prisma:generate &&
      npm run build:backend
    # Clear any stuck FAILED migration record (Prisma P3009 self-heal), then
    # apply DB migrations, then start the compiled server. The heal is scoped to
    # one migration name and failed rows only, and never fails the boot.
    startCommand: >-
      (npm --workspace @smm/backend exec -- prisma db execute --url "$DATABASE_URL" --file prisma/heal.sql || true) &&
      npm --workspace @smm/backend exec -- prisma migrate deploy &&
      node apps/backend/dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Cron heartbeat off until you're ready for autonomous posting.
      - key: ENABLE_CRON
        value: "0"
      # Real Claude captions — key is set in the dashboard (July 2026).
      - key: LLM_FAKE
        value: "0"
      # ── Paste these in the Render dashboard (kept out of git) ──────────
      - key: DATABASE_URL          # Neon Postgres connection string
        sync: false
      - key: REDIS_URL             # Upstash Redis connection string (rediss://)
        sync: false
      - key: PUBLIC_BASE_URL       # this service's own https URL (for Twilio)
        sync: false
      - key: PUBLIC_SITE_URL       # your marketing site URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY  # 32-byte base64 secret (for token storage)
        sync: false
      # ── Optional: fill these later to flip paid features on ────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      # Generated photography, for posts where the owner sent no picture.
      # Optional: captions, carousels and owner photos all work without it —
      # carousels are rendered from text, so they never touch an image API.
      # Declared here so a fresh environment is asked for it rather than
      # quietly shipping with generation switched off.
      - key: OPENAI_API_KEY
        sync: false
      - key: POST_FOR_ME_API_KEY
        sync: false
      # Nasser's own cell. When set, every delivered free-taste draft texts
      # him the lead's number + blurb + caption so he can follow up personally
      # (launch plan: text every lead). Unset = no alerts, no other change.
      - key: LEAD_ALERT_PHONE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false

  # ── Heavy-video worker ────────────────────────────────────────────────────
  # The SAME build, run as a background worker (no HTTP). It consumes the reel
  # queue and does the ffmpeg render off the web instance, so a 4K/HDR reel can
  # never OOM the customer-facing service. Standard plan = 2GB RAM, which video
  # actually needs. It does NOT run migrations (the web service owns those).
  #
  # ONE-TIME SETUP: this service needs the same secrets as the web service.
  # Easiest path in Render → aissm-worker → Environment → copy the variables
  # from aissm-backend (including the R2_* vars set directly in the dashboard).
  - type: worker
    name: aissm-worker
    runtime: node
    plan: standard
    branch: main
    buildCommand: >-
      npm install --include=dev &&
      npm run build:contracts &&
      npm --workspace @smm/backend run prisma:generate &&
      npm run build:backend
    startCommand: node apps/backend/dist/main.js
    autoDeploy: true
    envVars:
      - key: SERVICE_ROLE
        value: worker
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Cron belongs to the web service; never run it on the worker.
      - key: ENABLE_CRON
        value: "0"
      - key: LLM_FAKE
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # R2 object storage. The worker reads the owner's banked clips back OUT of
      # R2 (storage.get) to render the reel, and writes the finished mp4 back in,
      # then hands out an R2 public URL for it — so it needs the SAME R2_* values
      # as the web service. Copy them from aissm-backend → Environment.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: POST_FOR_ME_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
